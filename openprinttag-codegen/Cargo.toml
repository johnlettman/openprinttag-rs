[package]
name = "openprinttag-codegen"
version.workspace = true
authors.workspace = true
edition.workspace = true

[features]
all = ["url-loader", "format"]
default = ["url-loader", "format"]

tracing = ["dep:tracing"]

url-loader = ["dep:ureq"]
format = ["dep:prettyplease"]


[dependencies]
thiserror = "2.0"
tracing = { version = "0.1", optional = true }

syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
quote2 = "0.9"
prettyplease = { version = "0.2", optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9"

derive-new = "0.7"
strum = { version = "0.27", features = ["derive"] }

ureq = { version = "3.1", features = ["gzip", "rustls"], default-features = false, optional = true }
parking_lot = "0.12"
